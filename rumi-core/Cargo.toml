[package]
name = "rumi-core"
version = "0.1.0"
edition = "2021"
description = "Native core for rumi — the filesystem tablet (codec + atomic byte I/O)."

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311"] }
tempfile = "3"
